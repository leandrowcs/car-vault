<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" role="img" aria-labelledby="carVaultLogoTitle">
  <title id="carVaultLogoTitle">Car Vault logo</title>
  <defs>
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Container Pill -->
  <rect width="500" height="220" rx="44" fill="#090D16" />
  
  <!-- Outer Badge / Gauge rings -->
  <circle cx="110" cy="110" r="70" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.38" stroke-width="3" />
  <circle cx="110" cy="110" r="58" fill="none" stroke="#D97706" stroke-opacity="0.25" stroke-width="6" stroke-dasharray="8 6" />

  <!-- Car Silhouette / Garage Vault Icon -->
  <g transform="translate(68, 70)">
    <!-- Sleek sports car roofline / hood -->
    <path d="M 6 52 C 14 36 28 26 44 26 L 56 26 C 68 26 78 33 82 44 L 88 52" fill="none" stroke="url(#amberGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />
    <!-- Car body base -->
    <path d="M 2 56 L 86 56 C 89 56 91 58 90 61 L 88 66 C 86 70 82 72 78 72 L 8 72 C 4 72 0 69 0 65 L 1 58 C 1 57 1.5 56 2 56 Z" fill="#1E293B" stroke="#F59E0B" stroke-width="2.5" />
    <!-- Vault crossbars -->
    <path d="M 20 40 L 66 40" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <circle cx="22" cy="70" r="9" fill="#090D16" stroke="#F59E0B" stroke-width="3.5" />
    <circle cx="68" cy="70" r="9" fill="#090D16" stroke="#F59E0B" stroke-width="3.5" />
    <circle cx="22" cy="70" r="3" fill="#FDE68A" />
    <circle cx="68" cy="70" r="3" fill="#FDE68A" />
  </g>

  <!-- Typography -->
  <text x="216" y="102" font-size="48" font-weight="800" font-family="'Manrope', Arial, sans-serif" letter-spacing="7" fill="#F8FAFC">CAR</text>
  <text x="216" y="162" font-size="58" font-weight="900" font-family="'Manrope', Arial, sans-serif" letter-spacing="8" fill="url(#amberGradient)" filter="url(#softGlow)">VAULT</text>
  <line x1="216" y1="180" x2="440" y2="180" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
</svg>

